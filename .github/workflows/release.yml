name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify tag matches package version
        run: |
          node --input-type=commonjs -e "
            const p = require('./package.json');
            const expected = 'v' + p.version;
            if (process.env.GITHUB_REF_NAME !== expected) {
              console.error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package.json version ' + expected);
              process.exit(1);
            }
          "

      - name: Build, test and syntax check
        run: npm run check

      - name: Publish userscript to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" src/weread-shelf.user.js --clobber
          else
            gh release create "$GITHUB_REF_NAME" src/weread-shelf.user.js \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
