name: CI

on:
  push:
    branches: [develop, release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build, test and syntax check
        run: npm run check

      - name: Verify the committed userscript is current
        run: git diff --exit-code -- src/weread-shelf.user.js
